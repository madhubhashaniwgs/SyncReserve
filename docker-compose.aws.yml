
services:
  postgres:
    ports: !reset []

  backend:
    environment:
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
    ports: !reset []
    volumes:
      - profile_data:/app/profile

  
  frontend:
    build:
      args:
        VITE_API_URL: /api
    ports: !override
      - "80:80"


volumes:
  profile_data:
