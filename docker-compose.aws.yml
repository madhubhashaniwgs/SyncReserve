
services:
  postgres:
    ports: !reset []

  backend:
    environment:
      DB_USERNAME: ${RDS_USERNAME:?Set RDS_USERNAME in .env}
      DB_PASSWORD: ${RDS_PASSWORD:?Set RDS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      SPRING_DATASOURCE_URL: jdbc:postgresql://syncreserve-db.c12g4uqe8nm3.ap-southeast-1.rds.amazonaws.com:5432/syncreserve_db
    ports: !reset []
    volumes:
      - profile_data:/app/profile

  
  frontend:
    build:
      args:
        VITE_API_URL: /api
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro


volumes:
  profile_data:
