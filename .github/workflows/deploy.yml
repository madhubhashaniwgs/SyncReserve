
name: SyncReserve CD

on:
  workflow_run:
    workflows: ["SyncReserve CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: syncreserve-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu

            cd /home/ec2-user/SyncReserve

            echo "Fetching latest main branch..."
            git fetch origin main

            BACKUP_DIR="/home/ec2-user/SyncReserve-backups/$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR"

            echo "Backing up production configuration..."
            cp Frontend/nginx.conf "$BACKUP_DIR/nginx.conf"
            cp docker-compose.aws.yml "$BACKUP_DIR/docker-compose.aws.yml"
            cp docker-compose.yml "$BACKUP_DIR/docker-compose.yml"

            echo "Checking for local configuration changes..."
            if ! git diff --quiet -- docker-compose.yml docker-compose.aws.yml Frontend/nginx.conf; then
              echo "Saving a patch of local configuration changes..."
              git diff -- docker-compose.yml docker-compose.aws.yml Frontend/nginx.conf > "$BACKUP_DIR/local-config.patch"
            fi

            echo "Aligning production configuration with main..."
            git restore --source=origin/main -- docker-compose.yml docker-compose.aws.yml Frontend/nginx.conf

            git switch -C main origin/main
            echo "Validating AWS Docker Compose configuration..."
            docker compose -f docker-compose.yml -f docker-compose.aws.yml config -q

            echo "Building and updating backend and frontend..."
            docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build backend frontend

            echo "Checking container status..."
            docker compose -f docker-compose.yml -f docker-compose.aws.yml ps

            echo "Checking HTTPS website..."
            curl --fail --silent --show-error --max-time 30 https://syncreserve.duckdns.org/ -o /dev/null

            echo "Deployment completed successfully."
