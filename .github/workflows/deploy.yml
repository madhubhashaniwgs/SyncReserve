
name: SyncReserve CD

on:
  workflow_run:
    workflows: ["SyncReserve CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: syncreserve-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2 using SSM
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::183022213244:role/SyncReserveGitHubActionsSSMRole
          aws-region: ap-southeast-1

      - name: Send deployment command to EC2
        id: deploy
        shell: bash
        env:
          INSTANCE_ID: i-08b10f275f6635559
        run: |
          set -euo pipefail

          cat > deployment.sh <<'REMOTE_SCRIPT'
          set -eu

          sudo -iu ec2-user bash <<'USER_SCRIPT'
          set -eu

          cd /home/ec2-user/SyncReserve

          echo "Fetching latest main..."
          git fetch origin main

          BACKUP_DIR="/home/ec2-user/SyncReserve-backups/$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$BACKUP_DIR"

          echo "Backing up production configuration..."
          cp Frontend/nginx.conf "$BACKUP_DIR/nginx.conf"
          cp docker-compose.yml "$BACKUP_DIR/docker-compose.yml"
          cp docker-compose.aws.yml "$BACKUP_DIR/docker-compose.aws.yml"

          echo "Saving current Docker images..."
          docker image inspect syncreserve-backend:latest >/dev/null
          docker image inspect syncreserve-frontend:latest >/dev/null

          docker tag syncreserve-backend:latest syncreserve-backend:rollback
          docker tag syncreserve-frontend:latest syncreserve-frontend:rollback

          echo "Aligning production files with main..."
          git restore --source=origin/main -- docker-compose.yml docker-compose.aws.yml Frontend/nginx.conf
          git switch -C main origin/main

          echo "Validating production configuration..."
          docker compose -f docker-compose.yml -f docker-compose.aws.yml config -q

          echo "Building and updating application..."
          docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build backend frontend

          echo "Checking HTTPS website..."
          curl --fail --silent --show-error --max-time 30 https://syncreserve.duckdns.org/ -o /dev/null

          echo "Deployment completed successfully."
          USER_SCRIPT
          REMOTE_SCRIPT

          jq -n --rawfile script deployment.sh \
            '{commands: [$script]}' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "SyncReserve production deployment from GitHub Actions" \
            --timeout-seconds 900 \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment and report result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: i-08b10f275f6635559
        run: |
          set -euo pipefail

          DEADLINE=$((SECONDS + 900))

          while (( SECONDS < DEADLINE )); do
            RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null) || {
                sleep 5
                continue
              }

            STATUS=$(jq -r '.Status' <<< "$RESULT")
            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                echo "Deployment failed. SSM output:"
                jq -r '.StandardOutputContent // ""' <<< "$RESULT"
                jq -r '.StandardErrorContent // ""' <<< "$RESULT"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Timed out waiting for deployment."
          echo "Check Systems Manager Run Command for command ID: $COMMAND_ID"
          exit 1
