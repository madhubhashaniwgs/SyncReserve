
name: SyncReserve CD

on:
  workflow_run:
    workflows: ["SyncReserve CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: syncreserve-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            cd /home/ec2-user/SyncReserve

            echo "Checking production configuration..."

            git fetch origin main

            if ! git diff --quiet HEAD origin/main -- docker-compose.yml docker-compose.aws.yml Frontend/nginx.conf; then
              echo "ERROR: Production files differ from the expected Git version."
              echo "Deployment stopped to protect the live website."
              exit 1
            fi

            if ! git diff --quiet -- docker-compose.yml docker-compose.aws.yml Frontend/nginx.conf; then
              echo "ERROR: Local production configuration has uncommitted changes."
              echo "Deployment stopped to protect the live website."
              exit 1
            fi

            echo "Configuration checks passed."
            echo "Automatic deployment is intentionally paused until the production branch and configuration are reconciled."
            exit 1
