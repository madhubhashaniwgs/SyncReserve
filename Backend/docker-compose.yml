services:

  postgres:
    image: postgres:18
    container_name: syncreserve-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: .
    container_name: syncreserve-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: