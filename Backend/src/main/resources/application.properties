spring.application.name=syncreserve
spring.config.import=optional:classpath:/application-local.properties

spring.datasource.url=jdbc:postgresql://postgres:5432/syncreserve_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.profile-directory=profile

# Frontend URL
app.frontend-urls=${APP_FRONTEND_URLS:http://localhost:5173}
app.reset-code-length=6

# Optional bootstrap admin (leave empty to disable)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Admin}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.port=8080